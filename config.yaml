# deal_bot configuration.
#
# `wants` are things you actually want. `sweeps` are broad trawls (free stuff)
# that get scored against every want plus a general "is this worth grabbing
# anyway" test, so a sweep can surface something you never thought to search for.

location:
  # City-level fallback. Put your real coordinates in .env as HOME_LAT /
  # HOME_LNG (and optionally RADIUS_MILES) -- this file is committed, .env is
  # not. Distances are straight-line, so real driving is typically 20-30%
  # further in a grid city.
  lat: 35.0844
  lng: -106.6504
  # 32, not 30: Belen's centroid is 30.01 miles out, so a radius of exactly 30
  # would miss it by 60 feet. 32 takes in Edgewood (26) and Belen (30) while
  # still excluding Moriarty (35) and Santa Fe (58).
  radius_miles: 32

defaults:
  min_deal_score: 7.0        # bar for the wants bin -- you will drive for these
  free_find_min_score: 5.0   # bar for free finds -- browsing, so a lower bar
  max_results_per_run: 5     # per hunt per source per run; bounds one run

db_path: data/dealbot.db

# Waking hours. Outside this window `dealbot once --due` does nothing at all --
# no fetching, no judging, no re-checks -- because nothing found at 3am can be
# collected at 3am, and every hour awake is requests against two sources that
# throttle. A bare `dealbot once` ignores the window, so you can always run one
# by hand.
#
# These are STARTING values. The window is edited from /settings and lives in
# the database from then on, so the dashboard and a hand edit never fight over
# this file. The timezone is the exception -- it belongs here.
schedule:
  enabled: true
  timezone: America/Denver
  start: "12:00"
  end: "20:00"

sources: [facebook, craigslist]   # any of: fixture, facebook, craigslist
                             # each source gets its own run per hunt, so one
                             # being throttled is visible rather than silent

scorer:
  backend: claude_code       # stub | claude_code
  triage_model: sonnet
  appraise_model: sonnet
  # Drafting a want's search terms. Sonnet on MEASUREMENT, not on the price
  # card: haiku costs ~6x more here. `claude -p` prepends a ~12k-token harness
  # prompt, so what matters is whether that is a cache write or a cache read --
  # and the cache is per model. The poller keeps sonnet's warm every 15 minutes;
  # a second model's would be cold nearly every time, since drafting happens a
  # few times a month. Haiku also spends 672-1,492 output tokens where sonnet
  # spends 40. See ScorerConfig for the numbers.
  suggest_model: sonnet
  claude_bin: /home/joey/.local/bin/claude
  timeout_seconds: 180
  batch_size: 20
  # A STARTING value, like the waking hours: it is edited from /settings and
  # lives in the database from then on. Per hunt per run, and 0 means never
  # look. The real gate is not this number -- an image pass is only bought for
  # a listing that would already reach a bin on its text score -- so raising it
  # buys looks only when a single batch is full of good things at once.
  max_image_checks: 10
  # Photos per image pass, ~260 tokens each at 512px. The first N in the
  # seller's own order. Two was a hedge against the hero shot being a room
  # photo; 339 of the collected listings have three or more, and the image pass
  # already changes the bin decision 55% of the time at ~$0.05 per change, so a
  # third angle is cheap for what it settles.
  images_per_check: 3
  # A blunt backstop. The real constraint is the one below.
  daily_cost_limit_usd: 10.0
  # Plan quota, shared with otter's incident triage and your own interactive
  # use. Claude Code reports live utilisation, so Curbside can stand aside
  # BEFORE otter gets refused rather than after. Fetching continues throughout:
  # it costs no quota, so the bot keeps collecting and only stops judging.
  max_five_hour_utilization: 0.70
  max_seven_day_utilization: 0.90
  utilization_stale_minutes: 30

facebook:
  city: albuquerque
  # Throttling is SILENT -- Facebook keeps answering 200 with a full-size page
  # that contains no listings at all. These numbers are set for never noticing
  # it rather than for speed.
  min_interval_seconds: 15
  max_requests_per_run: 25
  fetch_details: true

craigslist:
  area_id: 50                # 50 = albuquerque (its own coords match ours exactly)
  min_interval_seconds: 4    # friendlier than Facebook, but still polite
  # Raised from 40 when the re-check learned to ask the posting's own page
  # whether it still exists: a listing that IS still there now costs a HEAD
  # plus the item fetch, so the re-check's share of a pass doubled and it --
  # running last -- was the part that ran out. A pass at the top of the hour
  # is ~16 searches, up to 20 enrichments and up to 20 re-checks.
  max_requests_per_run: 60

recheck:
  # `gone` only ever meant "stopped appearing in results" -- 45 minutes off page
  # one on the free sweep. This asks the source outright whether the things in
  # your bins are still for sale. One detail fetch per listing per interval,
  # no model call, so it costs requests and no quota.
  # Two speeds. Saved things are the ones you might be about to drive
  # to, and there are only ever a handful, so they are asked about on every
  # pass. `wanted` and `free_find` are candidates you have not decided on and
  # the half that grows to dozens -- at 15 minutes those would be a few hundred
  # item-page fetches a day at a site that throttles silently, to learn
  # something `mark_gone` already half-answers for free.
  enabled: true
  every_hours: 6           # per listing, not per run
  saved_every_hours: 0.25  # your own list: every pass
  # Listings, not requests: since `liveness`, a Craigslist listing still on
  # sale costs TWO (the page HEAD that answers, then the item fetch that
  # refreshes the price). A deleted one costs one, because there is nothing
  # left to refresh.
  max_per_run: 10

discord:
  # Webhooks live in .env (gitignored), not here, so this file stays shareable:
  #   DISCORD_WANTS_WEBHOOK, DISCORD_FREE_WEBHOOK, DISCORD_MENTION_USER_ID
  enabled: true
  dashboard_url: "https://curbside.streamvine.app"
  mention_score: 8.0       # the free channel is muted, so a mention must earn it
  max_per_run: 10
  max_age_days: 7          # older backlog is marked seen WITHOUT pinging you
  pause_seconds: 1.2

wants:
  - name: tv-stand
    # `queries` cast the net for the targeted hourly search -- keyword search
    # cannot know that "media console" means "tv stand". `description` is what
    # the model judges against, and `requires` carries the pass/fail conditions
    # so each is evidenced separately instead of blurring into one number.
    queries:
      - "tv stand"
      - "media console"
      - "entertainment center"
      - "tv console"
      - "credenza"
    max_price: 250           # GUESS -- adjust
    requires:
      - "at least 70 inches wide"
      - "is a stand or console the TV sits on, not a wall mount or bracket"
      - "not a corner unit"
    description: |
      A large TV stand or media console for a big TV. Width is what matters most
      -- a narrow one is useless however nice it looks or however cheap it is.

      Prefer solid wood or genuinely sturdy construction. Particle board that is
      already sagging is not worth hauling. Mid-century and simple modern styles
      are welcome; glass-and-black-metal gaming towers are not.

      Dimensions are often not stated. Reason from whatever the listing gives --
      "six feet long" is 72 inches, "holds a 55 inch TV" implies something near
      that width -- and where there is genuinely nothing to go on, say so rather
      than guessing.

  - name: stacked-ottoman
    queries:
      - "ottoman"
      - "pouf"
      - "footstool"
      - "round ottoman"
    max_price: 150           # GUESS -- adjust
    requires:
      - "teal or blue in colour"
      - "body is three stacked round tiers, not one smooth cylinder or dome"
      - "round, not square or rectangular"
      - "not a storage ottoman with a lift-off lid"
    description: |
      A round ottoman or pouf built from three stacked round tiers -- three discs
      or cushions piled on top of each other, like a layer cake or a stack of
      macarons.

      Colour and tier count are frequently impossible to judge from a title
      alone. Where the text does not say, report it as unverifiable rather than
      assuming either way -- a human can settle it in seconds by looking.

sweeps:
  - name: free-nearby
    queries: ["free"]
    max_price: 0
    interval_minutes: 15     # free stuff evaporates in minutes
    # Do not pay to judge a free listing from a fortnight ago -- it is gone.
    # Want hunts have no such limit: priced things sit, and age is a buy signal.
    max_age_days: 7
    # These SEED the database the first time this hunt is seen, and are then
    # owned by the dashboard ("Never show" on a free card, or the list on
    # /settings) where they can be added to and removed. Adding a term here
    # afterwards does nothing for a hunt that already has a list -- the file
    # cannot tell a new term from one you deleted. Add it on /settings instead.
    # Matching is by whole word with plurals, so "bed" will not catch
    # "bedroom".
    exclude:
      - "free estimate"
      - "free delivery"
      - "free consultation"
      - "free quote"
