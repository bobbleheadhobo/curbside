<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Curbside{% endblock %}</title>
<style>
:root{--bg:#fbfaf8;--fg:#1a1a1a;--dim:#6b6b6b;--line:#e2ded8;--card:#fff;--good:#1a7f4b;--warn:#a8620a;--bad:#a11}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151513;--fg:#eceae6;--dim:#9a968f;--line:#2e2e2b;--card:#1d1d1b;--good:#4ec27f;--warn:#d99a3f;--bad:#e06c6c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
header{border-bottom:1px solid var(--line);padding:.8rem 1.2rem;display:flex;gap:1.2rem;align-items:baseline;flex-wrap:wrap}
header b{font-size:1.05rem}
a{color:inherit;text-decoration:none}
nav a{color:var(--dim);font-size:.9rem}
nav a:hover,a.on{color:var(--fg);text-decoration:underline}
main{max-width:1000px;margin:0 auto;padding:1.2rem}
h1{font-size:1.2rem;margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.85rem;margin-bottom:.7rem;display:flex;gap:.9rem}
.thumb{width:104px;height:104px;flex:none;border-radius:7px;background:var(--line);object-fit:cover;display:grid;place-items:center;color:var(--dim);font-size:.7rem}
.body{min-width:0;flex:1}
.title{font-weight:600;margin-bottom:.15rem}
.meta{color:var(--dim);font-size:.85rem}
.why{margin-top:.35rem;font-size:.9rem}
.score{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;text-align:right;min-width:2.6rem}
.s-hi{color:var(--good)} .s-mid{color:var(--warn)} .s-lo{color:var(--dim)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.05rem .5rem;font-size:.75rem;color:var(--dim);margin-right:.3rem}
.chip.flag{color:var(--bad);border-color:var(--bad)}
.chip.want{color:var(--good);border-color:var(--good)}
.chip.unk{color:var(--warn);border-color:var(--warn)}
.unknowns{margin-top:.35rem;font-size:.85rem;color:var(--warn)}
.reqs{margin-top:.35rem;font-size:.82rem;color:var(--dim)}
.reqs li{margin:.1rem 0}.reqs ul{margin:.2rem 0;padding-left:1.1rem}
.drop{color:var(--good);font-weight:600}
.strike{text-decoration:line-through;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500}
.err{color:var(--bad)}
form.inline{display:inline}
button{font:inherit;font-size:.82rem;padding:.25rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--dim)}
.empty{color:var(--dim);padding:2rem 0;text-align:center}
.wrap{overflow-x:auto}
</style></head><body>
<header><b><a href="/">Curbside</a></b>
<nav><a href="/">wants</a> &nbsp; <a href="/free">free finds</a> &nbsp; <a href="/saved">saved</a> &nbsp; <a href="/near">near misses</a> &nbsp;
{% for h in hunts %}<a href="/hunt/{{h.id}}">{{h.name}}</a> &nbsp;{% endfor %}
<a href="/runs">runs</a></nav></header>
<main>{% block content %}{% endblock %}</main></body></html>
